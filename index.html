<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Login Demo (Educational Only)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            margin-top: 80px;
        }
        .login-box {
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 40px;
            width: 350px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size:16px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            padding:12px 24px;
            border:none;
            border-radius:4px;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
        }
        #result{
            margin-top:30px;
            color:darkred;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign in</h2>
        <p>to continue to Google</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="showData()">Next</button>
    </div>
    <div id="result"></div>

    <script>
        function showData(){
            const email = document.getElementById("email").value;
            const password = document.getElementById("pass").value;
            document.getElementById("result").innerText = Demo Output:\nEmail: ${email}\nPassword: ${password};
        }
    </script>
</body>
</html>
